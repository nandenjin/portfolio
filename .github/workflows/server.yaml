name: server
on:
  push:
    branches:
      - master
      - renovate/*
  pull_request:

defaults:
  run:
    working-directory: .server

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm ci
        working-directory: .
      - run: npm run typecheck
      - run: npm run build
