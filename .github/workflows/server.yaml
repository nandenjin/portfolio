name: server
on:
  push:
    branches:
      - master
      - renovate/*
  pull_request:

defaults:
  run:
    working-directory: .server

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
        working-directory: .
      - run: npm run typecheck
      - run: npm run build
