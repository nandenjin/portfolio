name: server
on:
  push:
    branches:
      - master
      - renovate/*
  pull_request:

defaults:
  run:
    working-directory: .server

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
        working-directory: .
      - run: npm run typecheck
      - run: npm run build
