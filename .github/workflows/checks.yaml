name: checks
on:
  push:
    branches:
      - master
  pull_request:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: deno run --allow-read ./.scripts/check-links.ts .
