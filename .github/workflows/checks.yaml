name: checks
on:
  push:
    branches:
      - master
  pull_request:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      - uses: actions/checkout@v4
      - run: deno run --allow-read ./.scripts/check-links.ts .
