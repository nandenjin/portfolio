name: checks
on:
  push:
    branches:
      - master
  pull_request:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - uses: actions/checkout@v4
      - run: deno run --allow-read ./.scripts/check-links.ts .
